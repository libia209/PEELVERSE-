<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEELVERSE — From Peel to Purpose | Khám Phá Giá Trị Mới Từ Vỏ Trái Cây</title>
  <meta name="description" content="PEELVERSE (PEELSERVE) — Dự án nghiên cứu và sáng tạo biến vỏ trái cây thành dung dịch làm sạch thân thiện môi trường, kết hợp kiến thức khoa học và trò chơi tương tác." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Mobile Sidebar Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Điều hướng chính">
      <div class="sidebar-top">
        <a href="#home" class="brand" data-route="home">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="27" r="17" fill="#F49326" />
              <circle cx="24" cy="27" r="13.5" fill="#FFA940" />
              <path d="M24 14.5V39.5M11.5 27H36.5M15.2 18.2L32.8 35.8M32.8 18.2L15.2 35.8" stroke="#FFF4E0" stroke-width="2" stroke-linecap="round" />
              <circle cx="24" cy="27" r="3" fill="#FFF4E0" />
              <path d="M24 11C24 6.5 29 3 34 4.5C33.5 9.5 29.5 12.5 24 11Z" fill="#5D8C3E" />
              <path d="M24 11C21.5 8 18 7.5 16 9C17.5 11.5 21 12.5 24 11Z" fill="#7AAE4B" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">PEELVERSE</span>
            <span class="brand-sub">Explore • Learn • Recreate</span>
          </div>
        </a>

        <nav class="nav-menu">
          <button class="nav-item active" data-route="home">
            <span class="nav-icon">🏠</span>
            <span>Trang chủ</span>
          </button>
          <button class="nav-item" data-route="about">
            <span class="nav-icon">🌱</span>
            <span>Về dự án</span>
          </button>
          <button class="nav-item" data-route="ingredients">
            <span class="nav-icon">🍊</span>
            <span>Khám phá nguyên liệu</span>
          </button>
          <button class="nav-item" data-route="process">
            <span class="nav-icon">🔬</span>
            <span>Quy trình thực hiện</span>
          </button>
          <button class="nav-item" data-route="science">
            <span class="nav-icon">📖</span>
            <span>Kiến thức khoa học</span>
          </button>
          <button class="nav-item" data-route="game">
            <span class="nav-icon">🎮</span>
            <span>Trò chơi</span>
            <span class="nav-pill">6 màn</span>
          </button>
        </nav>

        <div class="sidebar-divider">Không gian cá nhân</div>
        <nav class="nav-menu nav-menu-secondary">
          <button class="nav-item" data-route="progress">
            <span class="nav-icon">📊</span>
            <span>Tiến trình khám phá</span>
          </button>
        </nav>
      </div>

      <!-- Decorative botanical footer in sidebar -->
      <div class="sidebar-botanical" aria-hidden="true">
        <div class="botanical-blob"></div>
        <div class="botanical-card">
          <span class="botanical-tag">PEELSERVE Lab</span>
          <p>From Peel to Purpose</p>
        </div>
        <img src="assets/images/ing-citrus.jpg" alt="" class="sidebar-orange-img" onerror="this.style.display='none'" />
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuToggleBtn" class="icon-btn mobile-only" aria-label="Mở menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>

          <div class="search-box">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="globalSearch" placeholder="Tìm kiếm trong PEELVERSE (nguyên liệu, limonene, độ pH...)" autocomplete="off" />
            <div id="searchDropdown" class="search-dropdown hidden"></div>
          </div>
        </div>

        <div class="topbar-right">
          <button id="notifBtn" class="icon-btn notif-btn" aria-label="Thông báo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span id="notifDot" class="notif-dot"></span>
          </button>

          <button class="avatar-pill" data-route="progress" title="Xem tiến trình khám phá">
            <span class="avatar-emoji">🐱</span>
            <span class="avatar-xp" id="headerXp">0%</span>
          </button>
        </div>

        <!-- Notification Popover -->
        <div id="notifPopover" class="notif-popover hidden">
          <div class="notif-header">
            <strong>Hoạt động khám phá</strong>
            <button id="resetProgressBtn" class="text-btn">Đặt lại tiến trình</button>
          </div>
          <div id="notifList" class="notif-list"></div>
        </div>
      </header>

      <!-- Dynamic Route View Container -->
      <main id="appView" class="app-view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
